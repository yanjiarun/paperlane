name: Deploy Paperlane to GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: paperlane-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Restore accumulated feed history
        uses: actions/cache@v4
        with:
          path: paper-history.json
          key: paperlane-history-${{ github.run_id }}
          restore-keys: |
            paperlane-history-

      - name: Build static paper feeds
        env:
          PAPERLANE_REVISION: ${{ github.sha }}
          PAPERLANE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          PAPERLANE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: python paperlane_server.py --build-static _site --days 365 --ieee-scope ea+5

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
